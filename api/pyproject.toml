[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerly-api"
version = "0.1.0"
description = "FastAPI application for Ledgerly"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "ledgerly-shared>=0.1.0",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
