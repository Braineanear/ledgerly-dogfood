# Lint is left out on purpose; the test job only runs make test.
# A separate commitlint job checks commit messages on pull requests.
# A trivy job builds the api image and scans it for HIGH and CRITICAL
# vulnerabilities that have a fix.
# Actions are pinned to exact release tags.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 9
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install Python packages
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e shared
          .venv/bin/python -m pip install -e api
          .venv/bin/python -m pip install -e worker
          .venv/bin/python -m pip install pytest
      - name: Install web packages
        run: pnpm --dir web install --frozen-lockfile
      - name: Test
        run: make test

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 20
      # Installed into the checkout's node_modules (ignored, no manifest or
      # lockfile) so the ESM config resolves its preset from the repo root.
      - name: Install commitlint
        run: |
          npm install --no-save --no-package-lock @commitlint/cli@19.8.1 @commitlint/config-conventional@19.8.1
      - name: Lint pull request commits
        run: |
          npx --no-install commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Build api image
        run: docker build -f api/Dockerfile -t ledgerly-api:ci .
      - name: Scan api image with Trivy
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ledgerly-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
