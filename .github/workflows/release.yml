# Builds multi-arch images and pushes them to GHCR on version tags.
# The web image is left out on purpose: it runs a pnpm dev server, so it
# is not a release artifact.
# The api image also gets an SBOM (SPDX JSON, uploaded as a workflow
# artifact). Syft scans one platform of the multi-arch image.
# Actions are pinned to exact release tags.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - api
          - worker
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Lowercase the image name
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_NAME=ghcr.io/${owner}/ledgerly-${{ matrix.image }}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3.6.0
      - uses: docker/setup-buildx-action@v3.11.1
      - uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
      - uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - uses: anchore/sbom-action@v0.20.0
        if: matrix.image == 'api'
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          format: spdx-json
          output-file: sbom-api.spdx.json
          upload-artifact: true
